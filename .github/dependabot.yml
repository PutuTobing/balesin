# Pembaruan mingguan, dikelompokkan supaya PR tidak membanjir.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    commit-message:
      prefix: 'chore(ci)'
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    commit-message:
      prefix: 'chore(docker)'
    labels: [dependencies]
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    commit-message:
      prefix: 'chore(docker)'
    labels: [dependencies]
    groups:
      compose:
        patterns: ['*']
