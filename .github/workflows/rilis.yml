# Rilis Balesin self-hosted: dipicu tag `vX.Y.Z` yang commit-nya ADA DI `main` (dibuat Tobing setelah
# review). Review keamanan Fase 7 S4:
#  - tag harus berasal dari `main` (cek ancestry) dan job memakai environment `rilis` (reviewer wajib
#    diatur di GitHub → Settings → Environments, lihat docs/BUTUH-TOBING.md #18);
#  - tag image versi TIDAK boleh ditimpa (gagal bila sudah ada di registry);
#  - docker-compose.yml rilis merujuk image dengan DIGEST, jadi SHA256SUMS sekaligus mengunci isi image;
#  - image dan SHA256SUMS ditandatangani cosign keyless (OIDC GitHub, Sigstore); install.sh dan
#    `balesin update` memverifikasi tanda tangan SHA256SUMS bila cosign terpasang.
# Catatan: tanda tangan keyless tercatat di log transparansi publik Sigstore (Rekor) beserta nama repo
# dan workflow ini — lihat DECISIONS 2026-11-22 "Fase 7 — rilis".
name: Rilis

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: rilis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rilis:
    name: Image + berkas rilis
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: rilis
    env:
      PLATFORMS: linux/amd64,linux/arm64
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag harus berasal dari main
        # fetch-depth: 0 sudah mengambil semua branch (refs/remotes/origin/*); fetch ulang tanpa
        # kredensial akan gagal di repo privat (persist-credentials: false).
        run: |
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null ||
            { echo "::error::origin/main tidak ada di checkout."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main ||
            { echo "::error::Commit tag ini tidak ada di main. Rilis hanya dari main."; exit 1; }
      - name: Versi dan nama image
        id: versi
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "versi=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${OWNER,,}/balesin" >> "$GITHUB_OUTPUT"
      # Image multi-arsitektur (amd64 + arm64): installer menerima host arm64 (install.sh, DEPLOY.md),
      # jadi image rilis wajib punya varian arm64. arm64 dibangun lewat emulasi QEMU; dependency native
      # (sharp/libvips, @node-rs/argon2, msgpackr) dipasang pnpm di dalam stage platform target, jadi
      # biner prebuilt yang terpasang selalu linuxmusl-<arsitektur target>.
      # docker/setup-qemu-action v4.4.0 — image binfmt dikunci digest.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      # docker/setup-buildx-action v4.4.1 — image BuildKit dikunci digest.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build image amd64 + arm64 (sebelum login registry)
        # Hasil build tinggal di cache builder; langkah push di bawah memakai cache yang sama (tidak
        # ada RUN yang dijalankan ulang setelah kredensial registry ada).
        env:
          VERSI: ${{ steps.versi.outputs.versi }}
          REVISI: ${{ github.sha }}
        run: |
          for target in api worker web; do
            docker buildx build -f deploy/docker/Dockerfile --target "$target" \
              --platform "$PLATFORMS" --provenance=false --sbom=false \
              --label "org.opencontainers.image.version=$VERSI" \
              --label "org.opencontainers.image.revision=$REVISI" .
          done
      - name: Uji asap tiap arsitektur (modul native termuat sebagai non-root)
        run: |
          for platform in ${PLATFORMS//,/ }; do
            arch="${platform#linux/}"
            node_arch="${arch/amd64/x64}" # nama arsitektur versi Node (process.arch)
            docker buildx build -f deploy/docker/Dockerfile --target api --platform "$platform" \
              --provenance=false --sbom=false --load -t "balesin-uji-api:$arch" .
            # Pemberitahuan lisensi (audit akhir A5): identik di setiap arsitektur, jadi satu aset rilis.
            docker run --rm --platform "$platform" --entrypoint cat "balesin-uji-api:$arch" \
              /app/THIRD-PARTY-NOTICES > "$RUNNER_TEMP/notices-$arch.txt"
            grep -q 'GNU LESSER GENERAL PUBLIC LICENSE' "$RUNNER_TEMP/notices-$arch.txt" ||
              { echo "::error::THIRD-PARTY-NOTICES $arch tidak memuat teks LGPL"; exit 1; }
            docker run --rm --platform "$platform" --entrypoint node "balesin-uji-api:$arch" \
              --input-type=module -e "
                import sharp from 'sharp';
                import { hash } from '@node-rs/argon2';
                if (process.arch !== '$node_arch') throw new Error('arsitektur ' + process.arch);
                if (process.getuid() === 0) throw new Error('berjalan sebagai root');
                const png = await sharp({ create: { width: 64, height: 64, channels: 4,
                  background: '#145ac8' } }).resize(32).png().toBuffer();
                await hash('uji-asap');
                console.log('$platform: sharp', sharp.versions.sharp, 'PNG', png.length, 'B, argon2 OK');
              "
            docker image rm "balesin-uji-api:$arch" >/dev/null
          done
          cmp "$RUNNER_TEMP/notices-amd64.txt" "$RUNNER_TEMP/notices-arm64.txt" ||
            { echo "::error::THIRD-PARTY-NOTICES berbeda antar-arsitektur"; exit 1; }
      # Pemindaian CVE (audit akhir A3) SEBELUM login registry dan push. Trivy dijalankan dari image
      # resminya yang dipin digest (bukan aksi pihak ketiga ber-tag), tanpa socket Docker: image
      # Balesin tiap arsitektur diekspor sebagai arsip docker dari cache build lalu dibaca read-only.
      #  - GAGAL: CVE KRITIS yang sudah punya versi perbaikan di image api/worker/web.
      #  - LAPORAN (tidak menggagalkan): semua HIGH/CRITICAL termasuk yang belum ada perbaikannya, dan
      #    image pihak ketiga di compose (postgres, redis, caddy, cloudflared) — perbaikannya datang
      #    dari upstream lewat PR Dependabot `docker-compose`.
      # Trivy tidak mengenali pustaka di dalam biner prebuilt sharp-libvips; versinya dicetak ke
      # ringkasan job dari THIRD-PARTY-NOTICES untuk dicek manual (pembaruan lewat Dependabot npm).
      - name: Pindai CVE image (Trivy)
        env:
          TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          scan="$RUNNER_TEMP/pindai"
          mkdir -p "$scan"
          trivy() {
            docker run --rm -v "$scan:/pindai:ro" -v balesin-trivy-cache:/root/.cache "$TRIVY_IMAGE" "$@"
          }
          trivy image --download-db-only --quiet
          {
            echo '### Pemindaian CVE (Trivy)'
            echo 'Versi pustaka native sharp-libvips (tidak terbaca Trivy):'
            echo '```'
            sed -n '/^Versi pustaka yang dibundel/,/^$/p' "$RUNNER_TEMP/notices-amd64.txt" | sort -u
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          gagal=0
          for platform in ${PLATFORMS//,/ }; do
            arch="${platform#linux/}"
            for target in api worker web; do
              docker buildx build -f deploy/docker/Dockerfile --target "$target" \
                --platform "$platform" --provenance=false --sbom=false \
                --output "type=docker,dest=$scan/$target-$arch.tar" .
              echo "::group::Laporan $target ($arch): HIGH/CRITICAL"
              trivy image --input "/pindai/$target-$arch.tar" --scanners vuln --skip-db-update \
                --severity HIGH,CRITICAL --exit-code 0 --quiet ||
                echo "::warning::Laporan $target ($arch) tidak selesai."
              echo "::endgroup::"
              if ! trivy image --input "/pindai/$target-$arch.tar" --scanners vuln --skip-db-update \
                --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet; then
                echo "::error::Image $target ($arch) memuat CVE KRITIS yang sudah ada perbaikannya."
                echo "- GAGAL $target ($arch): CVE kritis dengan perbaikan" >> "$GITHUB_STEP_SUMMARY"
                gagal=1
              fi
              rm -f "$scan/$target-$arch.tar"
            done
          done
          mapfile -t pihak_ketiga < <(sed -nE \
            's/^ +image: ([a-z0-9./-]+:[^ @]+@sha256:[0-9a-f]{64})$/\1/p' deploy/docker-compose.yml)
          [ "${#pihak_ketiga[@]}" -ge 4 ] ||
            { echo "::error::Image pihak ketiga compose tidak terbaca (${#pihak_ketiga[@]})"; exit 1; }
          for ref in "${pihak_ketiga[@]}"; do
            for platform in ${PLATFORMS//,/ }; do
              echo "::group::Laporan $ref ($platform)"
              trivy image --platform "$platform" --scanners vuln --skip-db-update \
                --severity HIGH,CRITICAL --exit-code 0 --quiet "$ref" ||
                echo "::warning::Pemindaian $ref ($platform) tidak selesai."
              echo "::endgroup::"
              if ! trivy image --platform "$platform" --scanners vuln --skip-db-update \
                --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet --format json "$ref" >/dev/null; then
                echo "::warning::$ref ($platform): CVE kritis dengan perbaikan di upstream — perbarui lewat Dependabot."
                echo "- PERINGATAN $ref ($platform): CVE kritis dengan perbaikan (laporan)" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          exit "$gagal"
      # sigstore/cosign-installer v4.1.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - name: Masuk ke GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push image (tolak menimpa) + tanda tangan
        id: image
        env:
          PREFIX: ${{ steps.versi.outputs.prefix }}
          VERSI: ${{ steps.versi.outputs.versi }}
          REVISI: ${{ github.sha }}
        run: |
          for target in api worker web; do
            ref="$PREFIX-$target:$VERSI"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref sudah ada di registry. Versi rilis tidak boleh ditimpa — naikkan nomor versi."
              exit 1
            fi
          done
          for target in api worker web; do
            meta="$RUNNER_TEMP/meta-$target.json"
            # Argumen sama persis dengan langkah build → seluruh lapisan dari cache, lalu didorong
            # sebagai satu indeks multi-arsitektur.
            docker buildx build -f deploy/docker/Dockerfile --target "$target" \
              --platform "$PLATFORMS" --provenance=false --sbom=false \
              --label "org.opencontainers.image.version=$VERSI" \
              --label "org.opencontainers.image.revision=$REVISI" \
              -t "$PREFIX-$target:$VERSI" --push --metadata-file "$meta" .
            digest="$(jq -r '."containerimage.digest" // empty' "$meta")"
            [[ "$digest" == sha256:* ]] || { echo "::error::Digest $target tidak terbaca"; exit 1; }
            # Pastikan indeks yang terdorong memuat kedua arsitektur.
            for platform in ${PLATFORMS//,/ }; do
              docker buildx imagetools inspect --raw "$PREFIX-$target@$digest" |
                jq -e --arg os "${platform%%/*}" --arg arch "${platform#*/}" \
                  '.manifests | any(.platform.os == $os and .platform.architecture == $arch)' >/dev/null ||
                { echo "::error::Image $target tidak memuat $platform"; exit 1; }
            done
            # --recursive: indeks DAN manifest tiap arsitektur ikut ditandatangani.
            cosign sign --yes --recursive "$PREFIX-$target@$digest"
            echo "$target=$PREFIX-$target:$VERSI@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Siapkan berkas rilis (compose merujuk digest)
        env:
          VERSI: ${{ steps.versi.outputs.versi }}
          PREFIX: ${{ steps.versi.outputs.prefix }}
          IMG_API: ${{ steps.image.outputs.api }}
          IMG_WORKER: ${{ steps.image.outputs.worker }}
          IMG_WEB: ${{ steps.image.outputs.web }}
        run: |
          mkdir -p rilis
          # Ganti `${BALESIN_IMAGE_PREFIX…}-<target>:${BALESIN_VERSION…}` dengan referensi ber-digest.
          for target in api worker web; do
            var="IMG_${target^^}"
            pattern='image: \$\{BALESIN_IMAGE_PREFIX[^}]*\}-'"$target"':\$\{BALESIN_VERSION[^}]*\}'
            printf 's#%s#image: %s#\n' "$pattern" "${!var}"
          done > "$RUNNER_TEMP/digest.sed"
          sed -E -f "$RUNNER_TEMP/digest.sed" deploy/docker-compose.yml > rilis/docker-compose.yml
          # SETIAP baris image (Balesin + pihak ketiga, audit akhir A3) wajib tag@sha256:<digest>.
          total="$(grep -cE '^ +image: ' rilis/docker-compose.yml)"
          pinned="$(grep -cE '^ +image: [^ $]+@sha256:[0-9a-f]{64}$' rilis/docker-compose.yml)"
          if [ "$total" -lt 8 ] || [ "$pinned" -ne "$total" ]; then
            echo "::error::Tidak semua image compose terkunci digest ($pinned dari $total)"
            exit 1
          fi
          cp deploy/Caddyfile deploy/balesin rilis/
          cp deploy/nginx/balesin.conf rilis/balesin-nginx.conf
          sed -e "s/^readonly DEFAULT_VERSION=.*/readonly DEFAULT_VERSION=\"$VERSI\"/" \
              -e "s#^readonly DEFAULT_IMAGE_PREFIX=.*#readonly DEFAULT_IMAGE_PREFIX=\"$PREFIX\"#" \
              deploy/install.sh > rilis/install.sh
          printf '%s\n' "$VERSI" > rilis/VERSION
          # Pemberitahuan lisensi pihak ketiga (audit akhir A5), sama persis dengan /app/THIRD-PARTY-NOTICES.
          cp "$RUNNER_TEMP/notices-amd64.txt" rilis/THIRD-PARTY-NOTICES.txt
          (cd rilis && sha256sum docker-compose.yml Caddyfile balesin balesin-nginx.conf install.sh VERSION \
            THIRD-PARTY-NOTICES.txt > SHA256SUMS)
          cosign sign-blob --yes --bundle rilis/SHA256SUMS.sigstore.json rilis/SHA256SUMS
      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" rilis/* --verify-tag --title "Balesin $TAG" \
            --notes "Pasang: curl -fsSL <URL>/install.sh | sudo bash — Update: sudo balesin update ${TAG#v}. Panduan: docs/panduan/ (bab 1 Instalasi, bab 8 Pemeliharaan)."
