# Rilis Balesin self-hosted: dipicu tag `vX.Y.Z` (dibuat Tobing setelah review `main`).
# 1. Build + push image api, worker, web ke GHCR (ghcr.io/<pemilik>/balesin-<target>:<versi>).
# 2. GitHub Release berisi berkas pemasangan: install.sh, docker-compose.yml, Caddyfile, CLI balesin,
#    contoh nginx, VERSION, SHA256SUMS (diperiksa install.sh dan `balesin update`).
# Catatan: repo & paket GHCR privat → server pelanggan butuh akses; lihat docs/BUTUH-TOBING.md.
name: Rilis

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: rilis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rilis:
    name: Image + berkas rilis
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versi dan nama image
        id: versi
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "versi=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${OWNER,,}/balesin" >> "$GITHUB_OUTPUT"
      - name: Masuk ke GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build dan push image
        env:
          PREFIX: ${{ steps.versi.outputs.prefix }}
          VERSI: ${{ steps.versi.outputs.versi }}
          REVISI: ${{ github.sha }}
        run: |
          for target in api worker web; do
            docker build -f deploy/docker/Dockerfile --target "$target" \
              --label "org.opencontainers.image.version=$VERSI" \
              --label "org.opencontainers.image.revision=$REVISI" \
              -t "$PREFIX-$target:$VERSI" .
            docker push "$PREFIX-$target:$VERSI"
          done
      - name: Siapkan berkas rilis
        env:
          VERSI: ${{ steps.versi.outputs.versi }}
          PREFIX: ${{ steps.versi.outputs.prefix }}
        run: |
          mkdir -p rilis
          cp deploy/docker-compose.yml deploy/Caddyfile deploy/balesin rilis/
          cp deploy/nginx/balesin.conf rilis/balesin-nginx.conf
          sed -e "s/^readonly DEFAULT_VERSION=.*/readonly DEFAULT_VERSION=\"$VERSI\"/" \
              -e "s#^readonly DEFAULT_IMAGE_PREFIX=.*#readonly DEFAULT_IMAGE_PREFIX=\"$PREFIX\"#" \
              deploy/install.sh > rilis/install.sh
          printf '%s\n' "$VERSI" > rilis/VERSION
          (cd rilis && sha256sum docker-compose.yml Caddyfile balesin balesin-nginx.conf install.sh VERSION > SHA256SUMS)
      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" rilis/* --title "Balesin $TAG" \
            --notes "Pasang: curl -fsSL <URL>/install.sh | sudo bash — Update: sudo balesin update ${TAG#v}. Panduan: docs/DEPLOY.md."
