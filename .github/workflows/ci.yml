# CI Balesin: format, lint, typecheck, tes, build, audit, E2E.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

# Batalkan run lama di branch/PR yang sama.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  # Kredensial dev/CI lokal (bukan rahasia produksi); cocok dengan .env.example.
  DATABASE_URL: postgres://balesin:balesin@localhost:5432/balesin
  DATABASE_URL_TEST: postgres://balesin:balesin@localhost:5432/balesin_test
  REDIS_URL: redis://:balesin@localhost:6379
  # DB 15 khusus tes integrasi antrian supaya tidak menyentuh data dev.
  REDIS_URL_TEST: redis://:balesin@localhost:6379/15

jobs:
  kualitas:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      # Gagalkan bila library WhatsApp tidak resmi masuk lockfile.
      - run: pnpm check:deps
      - run: pnpm typecheck
      # Penjaga keamanan berkas deploy (review Fase 7), tanpa database.
      - run: pnpm --filter @balesin/api test:deploy
      - run: pnpm build

  tes:
    name: Tes unit + integrasi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/infra
      - run: pnpm test

  audit:
    name: Audit dependency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Semua temuan tampil di log, tidak menggagalkan.
      - name: Ringkasan semua temuan (informasi)
        run: pnpm audit || true
      # Hanya temuan tinggi/kritis yang menggagalkan job.
      - name: Gagalkan jika ada temuan tinggi/kritis
        run: pnpm audit --audit-level high

  e2e:
    name: E2E Playwright (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/infra
      # Belum ada berkas tes = lewati dengan peringatan jelas; kalau ada, kegagalan tetap menggagalkan job.
      - name: Cek berkas tes E2E
        id: cek
        run: |
          if [ -n "$(find e2e/tests -type f \( -name '*.spec.ts' -o -name '*.test.ts' \) 2>/dev/null | head -n 1)" ]; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Belum ada tes di e2e/tests, langkah E2E dilewati."
          fi
      - name: Pasang Chromium
        if: steps.cek.outputs.ada == 'true'
        run: pnpm --filter @balesin/e2e exec playwright install --with-deps chromium
      # Playwright menyalakan sendiri backend E2E (database `balesin_e2e` dan Redis db 14 direset,
      # lalu API + worker, lihat e2e/stack/) dan web Vite di port 5180. Tidak butuh build.
      - name: Jalankan E2E
        if: steps.cek.outputs.ada == 'true'
        run: pnpm e2e
      - name: Unggah laporan saat gagal
        if: failure() && steps.cek.outputs.ada == 'true'
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: laporan-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Image produksi + installer (uji asap)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck install.sh dan CLI balesin
        run: >-
          docker run --rm -v "$PWD/deploy:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -x install.sh balesin
      - name: Build image api, worker, web
        run: |
          for target in api worker web; do
            docker build -f deploy/docker/Dockerfile --target "$target" -t "balesin-ci/balesin-$target:0.0.0-ci" .
          done
      # Audit akhir A5: pemberitahuan lisensi (termasuk teks LGPL libvips) ada & sama di ketiga image.
      - name: THIRD-PARTY-NOTICES ada di setiap image
        run: |
          for target in api worker web; do
            docker run --rm --entrypoint cat "balesin-ci/balesin-$target:0.0.0-ci" /app/THIRD-PARTY-NOTICES \
              > "$RUNNER_TEMP/notices-$target.txt"
            grep -q 'GNU LESSER GENERAL PUBLIC LICENSE' "$RUNNER_TEMP/notices-$target.txt"
            grep -q '^@img/sharp-libvips-linuxmusl-arm64@' "$RUNNER_TEMP/notices-$target.txt"
            cmp "$RUNNER_TEMP/notices-api.txt" "$RUNNER_TEMP/notices-$target.txt"
          done
      # Audit akhir A3: pemindaian CVE (INFORMASI, tidak menggagalkan CI — gerbang gagal ada di rilis.yml).
      # Trivy dari image resmi dipin digest, image dibaca dari arsip `docker save` (tanpa socket Docker).
      - name: Pindai CVE image (Trivy, informasi)
        env:
          TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          scan="$RUNNER_TEMP/pindai"
          mkdir -p "$scan"
          trivy() {
            docker run --rm -v "$scan:/pindai:ro" -v balesin-trivy-cache:/root/.cache "$TRIVY_IMAGE" "$@"
          }
          trivy image --download-db-only --quiet || { echo "::warning::Basis data Trivy gagal diunduh."; exit 0; }
          for target in api worker web; do
            docker save -o "$scan/$target.tar" "balesin-ci/balesin-$target:0.0.0-ci"
            echo "::group::Laporan $target: HIGH/CRITICAL"
            trivy image --input "/pindai/$target.tar" --scanners vuln --skip-db-update \
              --severity HIGH,CRITICAL --exit-code 0 --quiet || true
            echo "::endgroup::"
            trivy image --input "/pindai/$target.tar" --scanners vuln --skip-db-update \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet --format json >/dev/null ||
              echo "::warning::Image $target memuat CVE KRITIS yang sudah ada perbaikannya — rilis akan GAGAL sampai diperbarui."
            rm -f "$scan/$target.tar"
          done
      - name: Konfigurasi gateway nginx valid
        run: docker run --rm --read-only --tmpfs /tmp:uid=101,gid=101 --add-host api:127.0.0.1 balesin-ci/balesin-web:0.0.0-ci nginx -t
      # Installer sungguhan (mode A, image lokal) → wizard setup terbuka → backup → restore.
      - name: Pasang dengan install.sh
        env:
          BALESIN_HOME: ${{ runner.temp }}/balesin
          BALESIN_MODE: A
          BALESIN_DOMAIN: balesin.ci.example
          BALESIN_UPSTREAM_PROXY: 192.0.2.10
          BALESIN_BIND_ADDRESS: 127.0.0.1
          BALESIN_HTTP_PORT: '18080'
          BALESIN_APP_URL: http://localhost:18080
          BALESIN_VERSION: 0.0.0-ci
          BALESIN_IMAGE_PREFIX: balesin-ci/balesin
          BALESIN_PROJECT_NAME: balesin-ci
          BALESIN_NO_PULL: '1'
          BALESIN_ASSUME_YES: '1'
          BALESIN_SKIP_LINK: '1'
        run: sudo -E bash deploy/install.sh
      - name: Cek kesehatan, header, dan wizard setup
        run: |
          curl -fsS http://localhost:18080/ready | grep -q '"status":"ok"'
          curl -fsS http://localhost:18080/api/v1/setup/status | grep -q '"needsSetup":true'
          curl -fsSI http://localhost:18080/setup | grep -qi "content-security-policy: default-src 'self'"
          curl -fsSI http://localhost:18080/sw.js | grep -qi 'cache-control: no-cache'
      - name: Backup lalu restore
        env:
          BALESIN_HOME: ${{ runner.temp }}/balesin
        run: |
          sudo -E "$BALESIN_HOME/balesin" backup
          backup="$(sudo ls "$BALESIN_HOME"/backups/ | grep -E '\.tar\.enc$' | head -n 1)"
          sudo -E "$BALESIN_HOME/balesin" restore "$BALESIN_HOME/backups/$backup" --yes --tanpa-backup-pengaman
          curl -fsS http://localhost:18080/ready | grep -q '"status":"ok"'
      - name: Log bila gagal
        if: failure()
        env:
          BALESIN_HOME: ${{ runner.temp }}/balesin
        run: sudo -E "$BALESIN_HOME/balesin" logs || true
