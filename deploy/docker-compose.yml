# Balesin — Docker Compose PRODUKSI (self-hosted).
#
# Dipasang `install.sh` ke /opt/balesin bersama `.env` (chmod 600, berisi SEMUA rahasia) dan
# dikelola lewat CLI `balesin` (update, backup, restore, status, logs). Jangan menjalankan berkas
# ini dari folder repo untuk produksi. Panduan: docs/panduan/.
#
# Topologi:
#   internet → [proxy: nginx perusahaan (mode A) | caddy (B) | cloudflared (C)] → web:8080
#   web (gateway nginx: berkas PWA + /api, /webhooks, /health, /ready) → api:3000
#   api, worker → postgres, redis (jaringan `data`, internal — tanpa akses keluar/masuk)
#   api, worker → internet (Graph API Meta, SMTP, Telegram) lewat jaringan `edge`
#
# Hanya `web` yang membuka port di host (BALESIN_BIND_ADDRESS:BALESIN_HTTP_PORT); mode B
# menambah caddy di 80/443. Postgres dan Redis tidak pernah terekspos.
#
# Nilai ${…} dibaca dari .env di folder yang sama. Variabel bertanda :? wajib ada.
#
# Image pihak ketiga dipin `tag@sha256:<digest indeks multi-arsitektur amd64+arm64>` (audit akhir
# A3): Docker menarik berdasarkan digest, jadi tag yang ditimpa di registry tidak ikut terpasang.
# Dependabot (`docker-compose`, /deploy) mengusulkan tag + digest baru; image Balesin dipin digest
# oleh workflow rilis.yml di berkas compose rilis.

name: balesin

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# Pengerasan container aplikasi: non-root (dari image), filesystem hanya-baca, tanpa capability.
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging: *logging

# Variabel yang dibaca api DAN worker (docs/PENGATURAN-UI.md: .env hanya infrastruktur).
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: ${APP_URL:?APP_URL wajib diisi di .env}
  # Peran database RUNTIME (hak baca/tulis data saja), bukan pemilik tabel.
  DATABASE_URL: postgres://${APP_DB_USER:?}:${APP_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-balesin}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  BALESIN_MASTER_KEY: ${BALESIN_MASTER_KEY:?BALESIN_MASTER_KEY wajib diisi di .env}
  MEDIA_DIR: /data/media
  META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
  # Cadangan opsional email pengirim; sumber utama = Pengaturan → Email pengirim di aplikasi.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_SECURE: ${SMTP_SECURE:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  TZ: UTC

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    # Entrypoint resmi mulai sebagai root hanya untuk menyiapkan folder data lalu turun ke pengguna
    # `postgres` (gosu): cukup capability berkas + ganti pengguna; sisanya dibuang.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=1m,mode=3777
    logging: *logging
    environment:
      # Peran bootstrap = PEMILIK tabel (dipakai migrasi, backup, restore). api/worker memakai
      # APP_DB_USER yang dibuat layanan `migrate`.
      POSTGRES_USER: ${POSTGRES_USER:-balesin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-balesin}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4.12-alpine3.22@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    # Pengguna `redis` (uid 999, pemilik /data di image) sejak awal: tanpa root, tanpa capability.
    user: redis
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging: *logging
    environment:
      # Dipakai redis-cli (healthcheck, `balesin restore`) tanpa menaruh password di argumen.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env}
    # Entrypoint resmi tetap dipakai (argumen pertama `redis-server`). Password diisi compose dari
    # .env — rahasia hanya di .env; redis mengganti judul prosesnya (`redis-server *:6379`) sehingga
    # password tidak tampak di daftar proses. noeviction: antrian BullMQ tidak boleh dibuang diam-diam.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
      - --save
      - '60 1000'
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  # Sekali jalan: migrasi sebagai pemilik tabel + menyelaraskan peran runtime. api menunggu ini
  # selesai dengan sukses. `balesin update` juga menjalankannya lebih dulu secara eksplisit.
  migrate:
    <<: *hardened
    image: ${BALESIN_IMAGE_PREFIX:-ghcr.io/pututobing/balesin}-api:${BALESIN_VERSION:?BALESIN_VERSION wajib diisi di .env}
    restart: 'no'
    command: ['node', 'dist/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-balesin}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-balesin}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER wajib diisi di .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD wajib diisi di .env}
    networks: [data]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *hardened
    image: ${BALESIN_IMAGE_PREFIX:-ghcr.io/pututobing/balesin}-api:${BALESIN_VERSION:?}
    environment:
      <<: *app-env
      API_URL: ${API_URL:?API_URL wajib diisi di .env}
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      # Proxy tepercaya: IP tetap gateway (+ caddy/cloudflared di mode B/C, + reverse proxy perusahaan
      # di mode A). Diisi installer; salah isi = semua klien tampak ber-IP sama (batas laju salah).
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY wajib diisi di .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diisi di .env}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      OUTBOUND_PRIVATE_ALLOWLIST: ${OUTBOUND_PRIVATE_ALLOWLIST:-}
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - media:/data/media
    networks: [data, edge]
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *hardened
    image: ${BALESIN_IMAGE_PREFIX:-ghcr.io/pututobing/balesin}-worker:${BALESIN_VERSION:?}
    environment:
      <<: *app-env
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      # Volume media BERSAMA api: lampiran email masuk disimpan worker, disajikan api.
      - media:/data/media
    networks: [data, edge]
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Gateway: berkas statis PWA + proxy ke api. Satu-satunya port aplikasi.
  web:
    <<: *hardened
    image: ${BALESIN_IMAGE_PREFIX:-ghcr.io/pututobing/balesin}-web:${BALESIN_VERSION:?}
    tmpfs:
      - /tmp:size=128m,uid=101,gid=101,mode=0700
    ports:
      # Mode A: IP privat VM (hanya proxy perusahaan yang boleh menjangkau — atur firewall).
      # Mode B/C: 127.0.0.1 (hanya untuk pemeriksaan lokal; lalu lintas lewat caddy/cloudflared).
      - '${BALESIN_BIND_ADDRESS:-127.0.0.1}:${BALESIN_HTTP_PORT:-8080}:8080'
    networks:
      edge:
        # Alamat tetap: hanya alamat ini (dan proxy di depannya) yang dipercaya api lewat TRUST_PROXY.
        ipv4_address: ${BALESIN_GATEWAY_IP:?BALESIN_GATEWAY_IP wajib diisi di .env}
    depends_on:
      api:
        condition: service_healthy

  # Mode B: Caddy di depan gateway, HTTPS otomatis Let's Encrypt (port 80 & 443 publik).
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: [caddy]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    environment:
      BALESIN_DOMAIN: ${BALESIN_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${BALESIN_CADDY_IP:-172.31.250.11}
    depends_on:
      web:
        condition: service_healthy

  # Mode C: Cloudflare Tunnel (tanpa port terbuka). Rute publik di dasbor Cloudflare →
  # http://web:8080. Token tunnel hanya di .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    profiles: [tunnel]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      edge:
        ipv4_address: ${BALESIN_TUNNEL_IP:-172.31.250.12}
    depends_on:
      web:
        condition: service_healthy

networks:
  # Postgres & Redis: tanpa gateway keluar, tidak terjangkau dari host/proxy.
  data:
    internal: true
  # Lalu lintas web + akses keluar api/worker. Subnet tetap; gateway/caddy/cloudflared memakai
  # alamat tetap (.10/.11/.12) di luar rentang alamat dinamis (.128–.255) supaya tidak bentrok.
  edge:
    ipam:
      config:
        - subnet: ${BALESIN_SUBNET:?BALESIN_SUBNET wajib diisi di .env}
          ip_range: ${BALESIN_DYNAMIC_RANGE:?BALESIN_DYNAMIC_RANGE wajib diisi di .env}

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
