# ────────────────────────────────────────────────────────────────────────────────────────────────
# Contoh konfigurasi nginx untuk Balesin di belakang reverse proxy yang sudah ada (MODE A).
# Dibuat untuk vm-nginx Sky Tech (IP publik 198.15.25.13) → VM Balesin (IP privat), tetapi berlaku
# umum. Pasang sebagai /etc/nginx/conf.d/balesin.conf (berkas conf.d di-include di dalam http {}).
#
# GANTI sebelum dipakai:
#   balesin.skytech.net.id   → domain Balesin
#   10.0.0.20:8080           → IP privat VM Balesin : BALESIN_HTTP_PORT (lihat /opt/balesin/.env)
#
# Urutan pemasangan (lihat docs/DEPLOY.md):
#   1. DNS A record domain → IP publik nginx ini.
#   2. Pasang berkas ini, KOMENTARI blok `server { listen 443 … }` dulu, `nginx -t && systemctl reload nginx`.
#   3. Sertifikat: certbot certonly --webroot -w /var/www/certbot -d balesin.skytech.net.id
#   4. Buka komentar blok 443, `nginx -t && systemctl reload nginx`.
#   5. Isi IP privat nginx ini ke UPSTREAM_PROXY_IPS saat install.sh (TRUST_PROXY di VM Balesin).
#
# Pembagian tugas header:
#   - TLS + HSTS          → di sini (titik akhir TLS). HSTS dari belakang disembunyikan supaya tidak dobel.
#   - CSP, X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy, Cache-Control
#                         → dipasang gateway Balesin (image `web`) dan api, ikut diperbarui lewat
#                           `balesin update`. JANGAN ditambahkan lagi di sini (header dobel = CSP
#                           digabung/aturan bertabrakan). Periksa: curl -sI https://balesin.skytech.net.id/
# ────────────────────────────────────────────────────────────────────────────────────────────────

# Batas laju per IP klien (pelengkap batas laju di aplikasi; pelanggar dapat 429).
limit_req_zone $binary_remote_addr zone=balesin_login:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=balesin_webhook:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=balesin_api:20m     rate=30r/s;
limit_conn_zone $binary_remote_addr zone=balesin_conn:10m;

# Log akses TANPA query string: URL media bertanda tangan (/api/public/media/…?sig=…) dan token
# apa pun di query tidak pernah tersimpan di log nginx.
log_format balesin_tanpa_query '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent rt=$request_time "$http_user_agent"';

# WebSocket: Upgrade diteruskan; permintaan biasa memakai koneksi keepalive ke upstream.
map $http_upgrade $balesin_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream balesin_gateway {
    server 10.0.0.20:8080;
    keepalive 32;
}

# HTTP → HTTPS (+ tantangan ACME untuk certbot).
server {
    listen 80;
    listen [::]:80;
    server_name balesin.skytech.net.id;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx ≥ 1.25.1. Versi lebih lama: hapus baris ini dan pakai `listen 443 ssl http2;`.
    http2 on;
    server_name balesin.skytech.net.id;
    server_tokens off;

    # ── TLS ──
    ssl_certificate     /etc/letsencrypt/live/balesin.skytech.net.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balesin.skytech.net.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:balesin_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── HSTS (180 hari, sama dengan api). Tanpa `preload` — aktifkan hanya bila semua subdomain https.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    access_log /var/log/nginx/balesin.access.log balesin_tanpa_query;
    error_log  /var/log/nginx/balesin.error.log warn;

    # Bawaan untuk API JSON & impor CSV/XLSX (5 MB). Unggah media & webhook punya location sendiri.
    client_max_body_size 8m;
    limit_conn balesin_conn 100;
    limit_req_status 429;
    limit_conn_status 429;

    # ── Header ke Balesin ──
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # nginx ini proxy TERDEPAN: alamat klien = $remote_addr. X-Forwarded-For kiriman klien dibuang
    # (tidak bisa dipalsukan). Bila kelak ada CDN di depan nginx ini, ganti ke
    # $proxy_add_x_forwarded_for + modul realip untuk alamat CDN.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $balesin_connection_upgrade;
    # Header Origin diteruskan APA ADANYA (pertahanan CSWSH WebSocket di api). JANGAN pernah menulis
    # `proxy_set_header Origin …`.
    proxy_connect_timeout 5s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
    # Unduhan media besar dialirkan, tidak ditampung ke disk nginx.
    proxy_max_temp_file_size 0;

    # Halaman web statis (PWA). Cache-Control (no-cache untuk index.html, /sw.js,
    # /manifest.webmanifest; immutable untuk /assets/) dipasang gateway — diteruskan apa adanya.
    location / {
        proxy_pass http://balesin_gateway;
    }

    # API umum.
    location /api/ {
        limit_req zone=balesin_api burst=200 nodelay;
        proxy_pass http://balesin_gateway;
    }

    # Titik masuk akun: login, langkah kedua 2FA, atur ulang password, undangan, wizard setup.
    location ~ ^/api/v1/(auth/login|auth/2fa/verify|auth/password-reset/|auth/invitation/accept|setup/(verify-token|complete)) {
        limit_req zone=balesin_login burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://balesin_gateway;
    }

    # Unggah media percakapan (web & API publik): dokumen s.d. 100 MB, dialirkan langsung.
    location ~ ^/api/v1/(public/)?conversations/[^/]+/media$ {
        limit_req zone=balesin_api burst=50 nodelay;
        client_max_body_size 101m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://balesin_gateway;
    }

    # WebSocket inbox real-time. Api mengirim heartbeat ±30 dtk; batas baca harus jauh di atasnya.
    location = /api/v1/inbox/stream {
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://balesin_gateway;
    }

    # Media bertanda tangan untuk n8n (kompatibel MobiChat): query string berisi tanda tangan —
    # format log di atas sudah tanpa query; di sini log akses dimatikan sekalian.
    location ^~ /api/public/media/ {
        access_log off;
        limit_req zone=balesin_api burst=100 nodelay;
        proxy_pass http://balesin_gateway;
    }

    # Webhook masuk Meta/Telegram/Messenger/Instagram: body ≤ 3 MiB (batas api), lonjakan wajar.
    location /webhooks/ {
        limit_req zone=balesin_webhook burst=500 nodelay;
        client_max_body_size 4m;
        proxy_pass http://balesin_gateway;
    }

    # Pemeriksaan kesehatan (status ok/down saja, tanpa data).
    location ~ ^/(health|ready)$ {
        access_log off;
        proxy_pass http://balesin_gateway;
    }
}
