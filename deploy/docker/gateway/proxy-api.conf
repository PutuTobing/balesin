# Penerusan ke container api (di-include di location /api, /webhooks, /health, /ready).
proxy_pass http://$api_upstream;
proxy_http_version 1.1;

proxy_set_header Host $host;
# Rantai alamat: proxy di depan (nginx perusahaan/Caddy/cloudflared) sudah menambahkan IP klien;
# gateway menambahkan IP proxy itu. api memercayai hop sesuai TRUST_PROXY (diisi installer).
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP "";
# Upgrade WebSocket bila diminta; selain itu koneksi ditutup per permintaan.
# Header Origin diteruskan APA ADANYA (pertahanan CSWSH di api bergantung padanya).
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Batas waktu bawaan diatur di tingkat server (nginx.conf) dan boleh ditimpa per location.
# Unduhan media besar dialirkan langsung, tidak ditampung di /tmp (tmpfs = RAM).
proxy_max_temp_file_size 0;
