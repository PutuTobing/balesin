# Header keamanan halaman web Balesin (SECURITY.md §8). Di-include di setiap location statis
# (add_header di location menimpa semua add_header induk, jadi tidak bisa dipasang sekali di server).
#
# CSP (keputusan di docs/DECISIONS.md, Fase 7):
#  - script-src 'self'                  tanpa skrip inline (theme-init.js berkas terpisah)
#  - style-src-elem 'self' 'unsafe-inline'
#                                       Radix (react-remove-scroll-bar) menyisipkan elemen <style>
#                                       saat dialog terbuka. Aman karena img/font/connect hanya ke
#                                       origin sendiri: CSS sisipan tidak punya jalur kirim data keluar.
#  - style-src-attr 'unsafe-inline'     atribut style React + pratinjau template email (iframe srcdoc)
#  - img-src 'self' data: blob:         logo data: di pratinjau email, media chat lewat object URL
#  - media-src 'self' blob:             video/audio chat lewat object URL
#  - worker-src 'self'                  service worker /sw.js
#  - manifest-src 'self' blob:          manifest PWA (merek white-label dibuat sebagai blob)
#  - frame-ancestors 'none'             tidak boleh dibingkai situs lain
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Kosong bila halaman dibuka lewat http (nginx tidak mengirim header bernilai kosong).
add_header Strict-Transport-Security $hsts_header always;
