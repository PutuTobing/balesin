# Gateway Balesin (image `web`): menyajikan berkas statis PWA dan meneruskan /api, /webhooks,
# /health, /ready ke container api. Ini SATU-SATUNYA port aplikasi yang dibuka ke luar compose;
# reverse proxy di depannya (nginx milik perusahaan / Caddy bawaan / cloudflared) cukup meneruskan
# semua lalu lintas ke sini. Header keamanan halaman web (CSP dkk.) dipasang DI SINI supaya sama di
# ketiga mode jaringan; respons /api membawa header keamanannya sendiri dari api (helmet).
#
# Berjalan sebagai pengguna non-root (nginx-unprivileged, uid 101), filesystem hanya-baca + /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    server_tokens off;
    # Redirect nginx (mis. folder tanpa "/") memakai Location relatif — port 8080 internal tidak bocor.
    absolute_redirect off;

    # Log TANPA query string: URL media bertanda tangan (/api/public/media/…?sig=…) dan token apa pun
    # di query tidak pernah masuk log. Yang dicatat hanya path.
    log_format balesin '$remote_addr xff="$http_x_forwarded_for" [$time_iso8601] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       'rt=$request_time "$http_user_agent"';
    access_log /dev/stdout balesin;

    # Kompresi aset statis. application/json sengaja TIDAK dikompres (respons API memuat token
    # CSRF — hindari BREACH).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml
               application/manifest+json text/plain;

    # DNS internal Docker: alamat container api dibaca ulang tiap 10 detik, jadi api yang dibuat
    # ulang (balesin update) langsung terjangkau tanpa me-restart gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Skema asli dari proxy di depan (TLS berakhir di sana). Hanya http/https yang diterima.
    map $http_x_forwarded_proto $fwd_proto {
        ~^https?$ $http_x_forwarded_proto;
        default   $scheme;
    }

    # HSTS hanya bila halaman memang dibuka lewat https (180 hari, sama dengan api).
    map $fwd_proto $hsts_header {
        https   "max-age=15552000; includeSubDomains";
        default "";
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Halaman statis hanya GET/HEAD; batas body kecil. Rute /api dan /webhooks punya batas sendiri.
        client_max_body_size 1m;

        set $api_upstream api:3000;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        # Dipakai healthcheck Docker untuk container ini saja (tidak menyentuh api).
        location = /gateway-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ── API ───────────────────────────────────────────────────────────────────────────────
        # JSON biasa 1 MiB, impor kontak/penerima broadcast CSV/XLSX 5 MiB (+ overhead multipart).
        location /api/ {
            client_max_body_size 8m;
            include /etc/nginx/balesin/proxy-api.conf;
        }

        # Unggah media percakapan (web & API publik): dokumen s.d. 100 MB. Dialirkan langsung ke
        # api (tanpa ditampung dulu di gateway); api memotong begitu melewati batas jenisnya.
        location ~ ^/api/v1/(public/)?conversations/[^/]+/media$ {
            client_max_body_size 101m;
            proxy_request_buffering off;
            client_body_timeout 300s;
            include /etc/nginx/balesin/proxy-api.conf;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Dokumen tampilan email (iframe sandbox, Fase 9): token akses ada di PATH → log akses
        # dimatikan, dan log galat hanya `crit` (review 9A-2 R12: galat upstream/limit_req level
        # `error` mencatat baris permintaan = token). Header keamanan (CSP `frame-ancestors`, tanpa
        # X-Frame-Options) dari api.
        location ^~ /api/v1/mail/view/ {
            access_log off;
            error_log /dev/stderr crit;
            include /etc/nginx/balesin/proxy-api.conf;
        }

        # WebSocket inbox real-time. Header Origin TIDAK disentuh: api menolak Origin asing (CSWSH).
        location = /api/v1/inbox/stream {
            include /etc/nginx/balesin/proxy-api.conf;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Webhook masuk Meta/Telegram/Messenger/Instagram: batas api 3 MiB.
        location /webhooks/ {
            client_max_body_size 4m;
            include /etc/nginx/balesin/proxy-api.conf;
        }

        location = /health {
            access_log off;
            include /etc/nginx/balesin/proxy-api.conf;
        }

        location = /ready {
            access_log off;
            include /etc/nginx/balesin/proxy-api.conf;
        }

        # ── Web (PWA statis) ──────────────────────────────────────────────────────────────────
        # Aset ber-hash dari Vite: aman di-cache selamanya.
        location /assets/ {
            try_files $uri =404;
            include /etc/nginx/balesin/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Service worker, manifest, dan index.html selalu divalidasi ulang supaya pengguna tidak
        # tertahan di versi lama setelah update.
        location = /sw.js {
            try_files $uri =404;
            include /etc/nginx/balesin/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        location = /manifest.webmanifest {
            try_files $uri =404;
            include /etc/nginx/balesin/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        location = /index.html {
            include /etc/nginx/balesin/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Berkas lain (ikon, favicon, theme-init.js) tidak ber-hash → no-cache (divalidasi lewat
        # ETag, murah). Path yang bukan berkas → aplikasi (router sisi klien).
        location / {
            try_files $uri /index.html;
            include /etc/nginx/balesin/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
    }
}
